name: build-devbox

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - Dockerfile
      - .github/workflows/build-devbox.yml
  workflow_dispatch:

concurrency:
  group: devbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show disk before cleanup
        run: df -h

      - name: Free disk space on GitHub runner
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show disk after cleanup
        run: df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: devbox:local
          # Hardcoded safe defaults. No more dynamic nonsense inputs.
          build-args: |
            TARGET_CPU=westmere
            INSTALL_PYTORCH_CPU=0
            NODE_VERSION=auto
            NEOVIM_VERSION=v0.11.5
            NERDFONTS_VERSION=v3.3.0
            GITUI_VERSION=0.27.0
            DOCKER_COMPOSE_VERSION=v2.36.0
            PODMAN_COMPOSE_VERSION=1.2.0
            PYTHON_VERSION=3.15.2

      - name: Show image size
        run: docker image ls devbox:local

      - name: Smoke test basic binaries
        run: |
          docker run --rm \
            -e START_CONTAINERD=0 \
            -e START_DOCKER=0 \
            -e START_PODMAN_SERVICE=0 \
            -e START_CLAMAV=0 \
            -e DROP_TO_USER=0 \
            devbox:local \
            bash -lc '
              set -eux
              nvim --version
              node --version
              npm --version
              python -V
              pip --version
              docker --version
              docker-compose --version
              podman --version
              podman-compose --version
              gitui --version
              gh --version
              ansible --version
              w3m -version || true
              lynx --version || true
              zsh -ic "echo zsh ok"
              /workspace/bin/westmere-check || true
            '

      - name: Smoke test Python imports
        run: |
          docker run --rm \
            -e START_CONTAINERD=0 \
            -e START_DOCKER=0 \
            -e START_PODMAN_SERVICE=0 \
            -e START_CLAMAV=0 \
            -e DROP_TO_USER=0 \
            devbox:local \
            python -c 'import requests, bs4, lxml, scrapy, numpy, pandas; print("python imports ok")'

      - name: Smoke test Node globals
        run: |
          docker run --rm \
            -e START_CONTAINERD=0 \
            -e START_DOCKER=0 \
            -e START_PODMAN_SERVICE=0 \
            -e START_CLAMAV=0 \
            -e DROP_TO_USER=0 \
            devbox:local \
            bash -lc '
              set -eux
              tsc --version
              eslint --version
              prettier --version
              webpack --version || true
            '